[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bitcoin-price-predictor"
version = "0.1.0"
description = "Streaming Bitcoin research scaffold with second-level replay, delayed labels, DDP training, and a Marimo dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "requests>=2.31",
  "pyarrow>=14.0",
  "psutil>=5.9",
]

[project.optional-dependencies]
train = ["torch>=2.2"]
live = ["marimo>=0.10", "plotly>=5.20", "websocket-client>=1.7"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
